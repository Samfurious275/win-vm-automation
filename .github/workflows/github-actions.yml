name: Install .NET + Python + Nginx on Windows VM

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Install .NET Framework and Reboot
  install_dotnet:
    name: "Install .NET Framework and Reboot"
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install .NET Framework 4.8 and Reboot
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Download .NET Framework 4.8
          $url = "https://download.visualstudio.microsoft.com/download/pr/2d6bb6b2-226a-4baa-bdec-798822606ff1/8494001c276a4b96804cde7829c04d7f/ndp48-x86-x64-allos-enu.exe"
          $output = "$env:TEMP\ndp48-x86-x64-allos-enu.exe"
          (New-Object System.Net.WebClient).DownloadFile($url, $output)

          # Install .NET Framework silently
          $process = Start-Process -FilePath $output -ArgumentList "/q /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
              Write-Error ".NET Framework installation failed with exit code: $($process.ExitCode)"
              exit 1
          }

          # Reboot the VM
          Write-Host "Rebooting VM..."
          Restart-Computer -Force

          # Wait for VM to come back online
          Start-Sleep -Seconds 180  # Adjust based on VM boot time

  # Job 2: Post-Reboot Configuration
  install_packages:
    name: "Install Python and Nginx after Reboot"
    runs-on: windows-latest
    needs: install_dotnet  # Ensure this runs after .NET install
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure WinRM and Install Packages
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Configure WinRM client
          net start winrm
          winrm quickconfig -quiet
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $true -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $true -Force

          # Add VM IP to TrustedHosts
          Set-Item WSMan:\localhost\Client\TrustedHosts $env:VM_IP -Force

          # Create credential
          $password = ConvertTo-SecureString "$env:VM_PASSWORD" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ("$env:VM_USER", $password)

          # Wait for WinRM to become available
          function Test-WinRMConnection {
            param($ip)
            try {
              $session = New-PSSession -ComputerName $ip -Port 5985 -Credential $credential -Authentication Basic -ErrorAction Stop
              Remove-PSSession -Session $session
              return $true
            } catch {
              return $false
            }
          }

          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            if (Test-WinRMConnection -ip "$env:VM_IP") {
              Write-Host "WinRM is now available."
              break
            }
            Write-Host "Waiting for WinRM... Attempt $attempt/$maxAttempts"
            Start-Sleep -Seconds 10
            $attempt++
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "WinRM did not become available within timeout."
            exit 1
          }

          # Run post-reboot script
          $session = New-PSSession -ComputerName "$env:VM_IP" -Port 5985 -Credential $credential -Authentication Basic
          Invoke-Command -Session $session -FilePath ".\scripts\post-reboot-install-packages.ps1"
          Remove-PSSession -Session $session

      - name: Reset WinRM Configuration (Cleanup)
        if: always()
        run: |
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $false -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $false -Force
          Set-Item WSMan:\localhost\Client\TrustedHosts "" -Force
          Write-Host "WinRM client configuration reset"
