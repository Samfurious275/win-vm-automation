name: Install Packages on Windows VM

on:
  push:
    branches:
      - main

jobs:
  install_packages:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup WinRM and Install Packages
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Start WinRM
          net start winrm
          winrm quickconfig -quiet

          # Allow unencrypted traffic
          Set-Item -Path WSMan:\localhost\Client\AllowUnencrypted -Value $true -Force
          Set-Item -Path WSMan:\localhost\Client\Auth\Basic -Value $true -Force

          # Add VM to TrustedHosts
          $trustedHostsPath = "WSMan:\localhost\Client\TrustedHosts"
          if (-not (Get-Item -Path $trustedHostsPath -ErrorAction SilentlyContinue)) {
              New-Item -Path $trustedHostsPath -Value "$env:VM_IP"
          } else {
              Set-Item -Path $trustedHostsPath -Value "$env:VM_IP" -Concatenate -Force
          }

          # Create credential
          $password = ConvertTo-SecureString "$env:VM_PASSWORD" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ("$env:VM_USER", $password)

          # Wait for WinRM
          function Test-WinRMConnection {
            param($ip)
            try {
              $session = New-PSSession -ComputerName $ip -Port 5985 -Credential $credential -Authentication Basic -ErrorAction Stop
              Remove-PSSession -Session $session
              return $true
            } catch {
              return $false
            }
          }

          $maxAttempts = 30
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            if (Test-WinRMConnection -ip "$env:VM_IP") {
              Write-Host "WinRM is now available."
              break
            }
            Write-Host "Waiting for WinRM... Attempt $attempt/$maxAttempts"
            Start-Sleep -Seconds 10
            $attempt++
          }

          # Run install script
          $session = New-PSSession -ComputerName "$env:VM_IP" -Port 5985 -Credential $credential -Authentication Basic
          Invoke-Command -Session $session -FilePath ".\scripts\install-packages.ps1"
          Remove-PSSession -Session $session
