name: Install Python and Node.js on Windows VM

on:
  push:
    branches:
      - main

jobs:
  install_python_nodejs:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure WinRM and Install Packages
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Step 1: Configure WinRM client
          net start winrm
          winrm quickconfig -quiet
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $true -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $true -Force
          Set-Item WSMan:\localhost\Client\TrustedHosts "$env:VM_IP" -Force

          # Step 2: Create credential
          $password = ConvertTo-SecureString "$env:VM_PASSWORD" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential("$env:VM_USER", $password)

          # Step 3: Wait for VM responsiveness
          function Test-WinRMConnection {
            param($ip)
            try {
              $session = New-PSSession -ComputerName $ip -Port 5985 -Credential $credential -Authentication Basic -ErrorAction Stop
              Remove-PSSession -Session $session
              return $true
            } catch {
              return $false
            }
          }

          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            if (Test-WinRMConnection -ip "$env:VM_IP") {
              Write-Host "WinRM is available."
              break
            }
            Write-Host "Waiting for WinRM... Attempt $attempt/$maxAttempts"
            Start-Sleep -Seconds 10
            $attempt++
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "WinRM did not become available within timeout."
            exit 1
          }

          # Step 4: Create remote session
          $session = New-PSSession -ComputerName "$env:VM_IP" -Port 5985 -Credential $credential -Authentication Basic

          # Step 5: Install Python and Node.js
          Write-Host "Installing Python and Node.js..."
          Invoke-Command -Session $session -ScriptBlock {
            # Install Python
            $pythonInstaller = "$env:TEMP\python-installer.exe"
            (New-Object System.Net.WebClient).DownloadFile("https://www.python.org/ftp/python/3.11.4/python-3.11.4-amd64.exe", $pythonInstaller)
            Start-Process -FilePath $pythonInstaller -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait

            # Reload PATH
            $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")

            # Verify Python installation
            python --version
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Python not found. Using full path..."
                & "C:\Users\Public\Python311\python.exe" --version
            }

            # Install Node.js
            $nodeInstaller = "$env:TEMP\node-installer.msi"
            (New-Object System.Net.WebClient).DownloadFile("https://nodejs.org/dist/v18.16.1/node-v18.16.1-x64.msi", $nodeInstaller)
            Start-Process -FilePath "msiexec.exe" -ArgumentList "/i $nodeInstaller /quiet" -Wait

            # Verify Node.js installation
            node --version
            npm --version
          }

          # Step 6: Cleanup
          Remove-PSSession -Session $session

      - name: Reset WinRM Configuration (Cleanup)
        if: always()
        run: |
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $false -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $false -Force
          Set-Item WSMan:\localhost\Client\TrustedHosts "" -Force
          Write-Host "WinRM client configuration reset"
