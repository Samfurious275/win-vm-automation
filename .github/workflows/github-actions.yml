name: Install Packages on Windows VM

on:
  push:
    branches:
      - main

jobs:
  install_packages:
    runs-on: windows-latest
    env:
      WINRM_PORT: 5985
      MAX_RETRIES: 30
      RETRY_DELAY: 10  # seconds

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Display Environment Info
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "Working Directory: $PWD"
          Write-Host "Environment Variables:"
          Get-ChildItem Env:

      - name: Configure WinRM Client
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Set error preference
          $ErrorActionPreference = "Stop"
          
          # Configure WinRM
          net start winrm
          winrm quickconfig -quiet
          
          # Set WinRM client configuration
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $true -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $true -Force
          
          # Add VM IP to trusted hosts
          Set-Item WSMan:\localhost\Client\TrustedHosts "${{ secrets.VM_IP }}" -Force

      - name: Test VM Connectivity with Retry
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Create credential object
          $password = ConvertTo-SecureString "$env:VM_PASSWORD" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:VM_USER", $password
          )

          # Connection test function
          function Test-Connection {
            param(
              [string]$ComputerName,
              [PSCredential]$Credential
            )
            try {
              $session = New-PSSession `
                -ComputerName $ComputerName `
                -Port $env:WINRM_PORT `
                -Credential $Credential `
                -Authentication Basic `
                -ErrorAction Stop
              Remove-PSSession -Session $session
              return $true
            } catch {
              Write-Warning "Connection failed: $_"
              return $false
            }
          }

          # Attempt connection with retry
          $attempt = 0
          $connected = $false

          while (-not $connected -and $attempt -lt $env:MAX_RETRIES) {
            Write-Host "Attempt $($attempt+1) of $($env:MAX_RETRIES): Trying $env:VM_IP"
            
            if (Test-Connection -ComputerName "$env:VM_IP" -Credential $credential) {
              Write-Host "Successfully connected to $env:VM_IP"
              $connected = $true
              break
            }
            
            Start-Sleep -Seconds $env:RETRY_DELAY
            $attempt++
          }

          if (-not $connected) {
            Write-Error "Failed to connect to VM after $($env:MAX_RETRIES) attempts"
            exit 1
          }

      - name: Deploy Packages to VM
        env:
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          # Reuse credential from previous step
          $password = ConvertTo-SecureString "$env:VM_PASSWORD" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:VM_USER", $password
          )

          # Create session to target
          try {
            $session = New-PSSession `
              -ComputerName "$env:VM_IP" `
              -Port $env:WINRM_PORT `
              -Credential $credential `
              -Authentication Basic

            Write-Host "Deploying packages to $env:VM_IP..."
            Invoke-Command -Session $session -FilePath ".\scripts\install-packages.ps1"
          } catch {
            Write-Error "Deployment failed: $_"
            exit 1
          } finally {
            if ($session) {
              Remove-PSSession -Session $session
            }
          }

      - name: Reset WinRM Configuration (Cleanup)
        if: always()
        run: |
          # Reset WinRM client settings
          Set-Item WSMan:\localhost\Client\AllowUnencrypted $false -Force
          Set-Item WSMan:\localhost\Client\Auth\Basic $false -Force
          Set-Item WSMan:\localhost\Client\TrustedHosts "" -Force
          Write-Host "WinRM client configuration reset"
